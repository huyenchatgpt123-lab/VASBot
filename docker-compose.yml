services:
  db:
    image: postgres:16-alpine
    container_name: vabot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vabot}
    # Do not expose Postgres publicly in production — remove ports or bind to 127.0.0.1
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vabot} -d ${POSTGRES_DB:-vabot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: vabot-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vabot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vabot}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ADMIN_API_KEY: ${OPENAI_ADMIN_API_KEY:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/15minutes}
      UPLOAD_DIR: /app/uploads
      FAISS_DIR: /app/faiss_data
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.office365.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VATask}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - upload_data:/app/uploads
      - faiss_data:/app/faiss_data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: vabot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
  faiss_data:
